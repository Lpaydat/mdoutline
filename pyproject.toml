[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdoutline"
version = "0.1.0"
description = "Markdown outline extractor - print the heading skeleton of a Markdown file as an indented outline"
requires-python = ">=3.11"

[project.scripts]
mdoutline = "mdoutline:main"

[tool.setuptools]
py-modules = ["mdoutline"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
